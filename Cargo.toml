[workspace]
resolver = "2"
members = [
    "crates/diceman",
    "crates/diceman-py",
    "crates/diceman-cli",
]

[workspace.package]
version = "0.6.1"
edition = "2021"
license = "MIT"
authors = ["Jerry Snitselaar"]
repository = "https://github.com/snits/diceman"

[workspace.dependencies]
diceman = { path = "crates/diceman" }
fastrand = "2"
thiserror = "2"
pyo3 = "0.28"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
